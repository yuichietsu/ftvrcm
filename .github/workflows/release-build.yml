name: FTVRCM - Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for var in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required GitHub Secret: ${var}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing configuration
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/ftvrcm-release.jks
          cat <<EOF > local.properties
          release.storeFile=keystore/ftvrcm-release.jks
          release.storePassword=${RELEASE_STORE_PASSWORD}
          release.keyAlias=${RELEASE_KEY_ALIAS}
          release.keyPassword=${RELEASE_KEY_PASSWORD}
          EOF

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Package and verify APK
        run: |
          mkdir -p dist
          apk_path="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk_path" ]; then
            echo "::error::Release APK not found at $apk_path"
            exit 1
          fi

          version_name=$(grep -E 'versionName\s*=' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | head -n 1)
          if [ -n "$version_name" ]; then
            out_apk="dist/ftvrcm-v${version_name}-release.apk"
          else
            out_apk="dist/ftvrcm-release.apk"
          fi
          cp "$apk_path" "$out_apk"

          echo "Build verification:"
          ls -lh "$out_apk"
          sha256sum "$out_apk"

          apksigner_bin=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$apksigner_bin" ]; then
            "$apksigner_bin" verify --verbose "$out_apk"
          fi

      - name: Cleanup signing files
        if: always()
        run: |
          rm -f keystore/ftvrcm-release.jks local.properties

      - name: Generate release notes
        run: |
          python3 - <<'EOF'
          import os
          import re
          import subprocess

          def run_git(args):
              return subprocess.check_output(['git'] + args, text=True).strip()

          tags_raw = run_git(['tag', '--list', 'build-*', '--sort=-creatordate'])
          prev_tag = tags_raw.splitlines()[0] if tags_raw else ''

          if prev_tag:
              log_range = f'{prev_tag}..HEAD'
              log_args = ['log', log_range, '--no-merges', '-n', '20', '--format=%h\t%s']
          else:
              log_args = ['log', '-n', '10', '--no-merges', '--format=%h\t%s']

          log_raw = run_git(log_args)
          feats, fixes, others = [], [], []

          for line in log_raw.splitlines():
              if '\t' not in line:
                  continue
              sha, subj = line.split('\t', 1)
              entry = f'- {subj} (`{sha}`)'
              if re.match(r'^feat(\([^)]+\))?!?:', subj):
                  feats.append(entry)
              elif re.match(r'^fix(\([^)]+\))?!?:', subj):
                  fixes.append(entry)
              else:
                  others.append(entry)

          lines = [
              '**ftvrcm - Automated Fire TV Stick APK Build**',
              '',
              '### 📝 Changelog',
          ]

          if feats:
              lines.append('')
              lines.append('**✨ 新機能**')
              lines.extend(feats)

          if fixes:
              lines.append('')
              lines.append('**🐛 バグ修正**')
              lines.extend(fixes)

          if others:
              lines.append('')
              lines.append('<details>')
              lines.append(f'<summary>その他の変更 ({len(others)}件)</summary>')
              lines.append('')
              lines.extend(others)
              lines.append('')
              lines.append('</details>')

          if not (feats or fixes or others):
              lines.append('')
              lines.append('- 変更履歴なし')

          run_id = os.environ['GITHUB_RUN_ID']
          repo = os.environ['GITHUB_REPOSITORY']
          if prev_tag:
              lines.append('')
              lines.append(f'**Full Changelog**: https://github.com/{repo}/compare/{prev_tag}...build-{run_id}')

          lines.extend([
              '',
              '---',
              '📋 **Build Information:**',
              f"- Commit: `{os.environ['GITHUB_SHA']}`",
              f"- Branch: `{os.environ['GITHUB_REF_NAME']}`",
              f"- Build Number: `#{os.environ['GITHUB_RUN_NUMBER']}`",
          ])

          os.makedirs('dist', exist_ok=True)
          with open('dist/release-notes.md', 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_id }}"
          name: "Auto Build #${{ github.run_number }}"
          body_path: dist/release-notes.md
          files: dist/*.apk
          draft: false
          prerelease: true
          fail_on_unmatched_files: true

      - name: Cleanup old releases
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up old releases (keeping latest 5)..."
          releases=$(gh release list --limit 50 --json tagName --jq '.[] | select(.tagName | startswith("build-")) | .tagName' | tail -n +6)

          for tag in $releases; do
            if [ -n "$tag" ] && [ "$tag" != "build-${{ github.run_id }}" ]; then
              echo "Deleting release: $tag"
              gh release delete "$tag" --yes --cleanup-tag || echo "Failed to delete $tag (might not exist)"
            fi
          done
